<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sistema Solar Interativo em Realidade Aumentada</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./src/styles.css">
  <script defer src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script type="module" src="./src/app.js"></script>
</head>
<body>
  <div id="stage" aria-hidden="true"></div>
  <header>
    <div class="heading">
      <h1>Sistema Solar Interativo</h1>
      <p>Tamanhos, distâncias e velocidades ilustrativos</p>
    </div>
    <nav aria-label="Modo de visualização">
      <a id="ar-link" href="./?modo=ra">Usar câmera</a>
      <a id="preview-link" href="./">Ver sem câmera</a>
      <a href="./assets/hiro.png" target="_blank" rel="noopener">Marcador Hiro ↗</a>
    </nav>
    <p id="status" role="status">Carregando a cena 3D…</p>
  </header>
  <main>
    <section id="details" aria-labelledby="planet-name" hidden>
      <h2 id="planet-name" tabindex="-1"></h2>
      <p id="planet-type" class="planet-type"></p>
      <p id="planet-fact"></p>
      <button id="back" type="button">Voltar ao Sistema Solar</button>
    </section>
  </main>
  <footer id="controls" hidden>
    <div class="playback">
      <button id="pause" type="button">Pausar</button>
      <label for="speed">Velocidade</label>
      <select id="speed">
        <option value="0.5">0,5×</option>
        <option value="1" selected>1×</option>
        <option value="2">2×</option>
        <option value="4">4×</option>
      </select>
    </div>
    <nav id="planets" aria-label="Selecionar o Sol ou um planeta"></nav>
  </footer>
  <noscript>Ative o JavaScript para abrir a simulação.</noscript>
</body>
</html>
